name: Employee Batch CI

on:
  push:
    branches:
      - main

  schedule:
    # Every day at 9:00 AM IST
    # GitHub Actions cron uses UTC
    - cron: "30 3 * * *"

jobs:
  batch-job:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spring_batch_demo

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify java
        run: java --version

      - name: Build application
        run: mvn clean package -DskipTests

      - name: initialize database
        run: |
          docker exec -i $(docker ps -q --filter ancestor=mysql:8.4) \
          mysql -uroot -proot spring_batch_demo \
          < src/main/resources/Queries/StandardbatchjobTables.sql

      - name: Verify database tables
        run: |
          docker exec $(docker ps -q --filter ancestor=mysql:8.4) \
          mysql -uroot -proot spring_batch_demo \
          -e "SHOW TABLES;"

      - name: Run Employee Batch job
        env:
          DB_URL: jdbc:mysql://localhost:3306/spring_batch_demo
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          java -jar target/employee-batch-processor-*.jar \
            fileName=employee-summary.csv \
            run.id=$(date +%s) \
            --spring.main.web-application-type=none