spring.application.name=employee-batch-processor

spring.batch.job.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/spring_batch_demo
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari
spring.datasource.hikari.maximum-pool-size=10

spring.batch.jdbc.initialize-schema=always

logging.level.org.springframework.boot.batch.jdbc.autoconfigure=DEBUG
logging.level.org.springframework.boot.jdbc.init=DEBUG